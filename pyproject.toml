[project]
name = "grtmesh"
version = "0.1.0"
description = ""
authors = [
    {name = "unclearness",email = "unclearness.dev@gmail.com"}
]
readme = "README.md"
requires-python = "==3.11.3"
dependencies = [
    "adjusttext>=1.3.0",
    "japanize-matplotlib>=1.1.3",
    "numpy (>=2.2.5,<3.0.0)",
    "open3d>=0.19.0",
    "opencv-python (>=4.11.0.86,<5.0.0.0)",
    "scipy (>=1.15.2,<2.0.0)",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "lpips>=0.1.4",
    "scikit-image>=0.26.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = " https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
